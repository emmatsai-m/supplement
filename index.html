<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>服用紀錄卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <h1>服用紀錄卡</h1>
    <p>請輸入家庭通行碼以繼續</p>
    <input type="password" id="passcodeInput" placeholder="通行碼" onkeydown="if(event.key==='Enter') tryLogin()">
    <button onclick="tryLogin()">進入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appContent" style="display:none;">
<div class="wrap">

  <header class="top">
    <div class="brandmark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="3" y="12" width="24" height="10" rx="5" transform="rotate(-30 15 15)" stroke="#1F2A24" stroke-width="2" fill="#2F6F5E"/>
        <line x1="15" y1="6" x2="15" y2="24" stroke="#1F2A24" stroke-width="0" />
        <path d="M9 15 L21 15" stroke="#EEF3EE" stroke-width="2" transform="rotate(-30 15 15)"/>
      </svg>
      <div>
        <h1>服用紀錄卡</h1>
        <div class="sub">保健食品購買與成效追蹤</div>
      </div>
    </div>
    <div class="date-badge">
      <div id="todayBadge"></div>
      <div id="syncBadge" style="margin-top:4px; font-size:11px; color: var(--ink-soft);">雲端同步中…</div>
      <button onclick="doLogout()" style="margin-top:6px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:11px; cursor:pointer; font-family:inherit;">登出</button>
    </div>
  </header>

  <div class="tabs" style="margin-bottom:24px;">
    <button class="tab-btn active" data-tab="buy">購買紀錄</button>
    <button class="tab-btn" data-tab="use">服用紀錄</button>
    <button class="tab-btn" data-tab="stock">庫存／比價</button>
  </div>

  <!-- 購買紀錄 -->
  <section class="panel active" id="panel-buy">
    <div class="stats" id="buyStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增購買</h2>
      <div class="form-grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="buy-date">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>品項（用於比價分類，例如：綜合維他命C）</label>
          <input type="text" id="buy-item" placeholder="例如：綜合維他命C">
        </div>
        <div class="field">
          <label>品牌</label>
          <input type="text" id="buy-brand" placeholder="例如：善存">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>規格／劑量（選填）</label>
          <input type="text" id="buy-spec" placeholder="例如：500mg，60顆裝">
        </div>
        <div class="field">
          <label>每瓶／罐顆數</label>
          <input type="number" id="buy-units" min="1" step="1" placeholder="例如 100" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>購買數量（瓶／罐）</label>
          <input type="number" id="buy-qty" min="1" step="1" value="1" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>總價（元）</label>
          <input type="number" id="buy-total" min="0" step="1" placeholder="0" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>每瓶單價（自動）</label>
          <input type="text" id="buy-unitprice-display" disabled value="NT$ 0">
        </div>
        <div class="field">
          <label>每顆成本（自動）</label>
          <input type="text" id="buy-costperpiece-display" disabled value="—">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addPurchase()">新增這筆購買</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>採購紀錄</h2>
      <div id="buyListWrap"></div>
      <div class="pagination" id="buyPagination"></div>
    </div>
  </section>

  <!-- 服用紀錄 -->
  <section class="panel" id="panel-use">
    <div class="stats" id="useStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增服用紀錄</h2>
      <div class="form-grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="use-date">
        </div>
        <div class="field">
          <label>時間</label>
          <input type="time" id="use-time">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>品項</label>
          <select id="use-item">
            <option value="">請先於「購買紀錄」新增品項</option>
          </select>
        </div>
        <div class="field">
          <label>服用顆數</label>
          <input type="number" id="use-qty" min="0.5" step="0.5" value="1">
        </div>
        <div class="field">
          <label>劑量說明（選填）</label>
          <input type="text" id="use-dose" placeholder="例如：隨餐服用">
        </div>
        <div class="chip-select">
          <label>身體反應（可複選）</label>
          <div class="chip-row" id="reactionChips"></div>
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label>備註</label>
          <input type="text" id="use-note" placeholder="其他感受描述（選填）">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addUsage()">新增這筆紀錄</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>服用歷程</h2>
      <div id="useListWrap"></div>
      <div class="pagination" id="usePagination"></div>
    </div>
  </section>

  <!-- 商品庫存／比價 -->
  <section class="panel" id="panel-stock">
    <div class="card">
      <h2><span class="dot"></span>庫存與比價說明</h2>
      <p style="font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.6;">
        以「品項」分組：累計購買顆數扣除服用顆數為估算庫存（非精確值）；同一品項底下列出所有採購批次，依「每顆成本」由低到高排序，成本最低的批次會用底色標示，方便比較不同品牌／時間點的性價比。
      </p>
    </div>
    <div id="stockWrap"></div>
  </section>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
