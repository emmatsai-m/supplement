<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>服用紀錄卡</title>
<style>
  :root{
    --bg: #EEF3EE;
    --panel: #FBFCF9;
    --ink: #1F2A24;
    --ink-soft: #5B6B61;
    --line: #D6DFD8;
    --teal: #2F6F5E;
    --teal-deep: #1E4A3E;
    --amber: #C97B2E;
    --red: #B24A42;
    --grey-chip: #8B958E;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brandmark svg{ flex-shrink:0; }
  h1{
    font-family: "Noto Serif TC", serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    margin:0;
    font-weight: 700;
  }
  .sub{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  .date-badge{
    font-family: "Noto Serif TC", serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align:right;
  }

  .tabs{
    display:flex;
    gap:0;
    margin-bottom: 24px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
    width: fit-content;
  }
  .tab-btn{
    border:none;
    background: transparent;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor:pointer;
    color: var(--ink);
    font-family: inherit;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active{ background: var(--ink); color: #fff; }
  .tab-btn:not(.active):hover{ background: rgba(31,42,36,0.08); }

  section.panel{ display:none; }
  section.panel.active{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .card h2{
    font-size: 15px;
    margin: 0 0 16px;
    letter-spacing: 0.05em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--teal);
    display:inline-block;
  }

  .form-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }
  .field input, .field select{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus, .field select:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .field input:disabled{ background: #F1F4F1; color: var(--ink-soft); }

  .chip-select{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:8px; }
  .chip-select label{ font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    cursor:pointer;
    background:#fff;
    color: var(--ink-soft);
    user-select:none;
    transition: all .12s ease;
  }
  .chip.on-good{ background: var(--teal); border-color: var(--teal); color:#fff; }
  .chip.on-bad{ background: var(--red); border-color: var(--red); color:#fff; }
  .chip.on-neutral{ background: var(--amber); border-color: var(--amber); color:#fff; }

  .actions{ margin-top: 18px; display:flex; justify-content:flex-end; }
  button.submit{
    background: var(--ink);
    color:#fff;
    border:none;
    border-radius: 999px;
    padding: 10px 26px;
    font-size: 13.5px;
    font-weight:600;
    letter-spacing:0.05em;
    cursor:pointer;
    font-family:inherit;
  }
  button.submit:hover{ background: var(--teal-deep); }

  .stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat{
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    padding: 14px 16px;
  }
  .stat .num{ font-family:"Noto Serif TC", serif; font-size: 20px; color: var(--teal-deep); }
  .stat .label{ font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; margin-top: 2px; }

  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  thead th{
    text-align:left;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    padding: 8px 10px;
    border-bottom: 1.5px solid var(--ink);
  }
  tbody td{ padding: 10px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tbody tr:hover{ background: rgba(47,111,94,0.05); }
  .badge{
    display:inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    color:#fff;
    margin: 1px 3px 1px 0;
  }
  .b-good{ background: var(--teal); }
  .b-bad{ background: var(--red); }
  .b-neutral{ background: var(--amber); }
  .b-grey{ background: var(--grey-chip); }

  .empty{ text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size: 13px; }
  .money{ font-family:"Noto Serif TC", serif; }
  .del-btn{ border:none; background:none; cursor:pointer; color: var(--ink-soft); font-size: 12px; }
  .del-btn:hover{ color: var(--red); }

  .table-scroll{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ min-width: 520px; }

  .list-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .list-row:last-child{ border-bottom:none; }
  .lr-main{ flex:1; min-width:0; }
  .lr-title{ font-size:14px; font-weight:600; }
  .lr-title .lr-brand{ font-weight:400; color: var(--ink-soft); }
  .lr-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .lr-total{ font-size:14px; white-space:nowrap; text-align:right; }
  .lr-total .lr-cost{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .pagination{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px; }
  .page-btn{
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:6px 16px; font-size:12.5px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .page-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .page-info{ font-size:12.5px; color:var(--ink-soft); }

  .item-card{ margin-bottom:16px; }
  .item-card .stats{ margin-bottom:14px; }
  .best-row{ background: rgba(47,111,94,0.08); }

  @media (max-width: 700px){
    .wrap{ padding: 20px 14px 60px; }
    header.top{ flex-direction:column; align-items:flex-start; gap:10px; }
    .date-badge{ text-align:left; }
    h1{ font-size:22px; }
    .tabs{ width:100%; }
    .tab-btn{ flex:1; text-align:center; padding:10px 6px; font-size:12.5px; }
    .card{ padding: 16px 16px; }
    .actions{ justify-content:stretch; }
    button.submit{ width:100%; }
  }
  @media (max-width: 420px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
    .form-grid{ grid-template-columns: 1fr 1fr; }
  }

  #loginGate{ min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .login-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 30px;
    max-width: 340px;
    width: 100%;
    text-align:center;
  }
  .login-card h1{ font-size:22px; margin-bottom:6px; }
  .login-card p{ font-size:12.5px; color: var(--ink-soft); margin: 0 0 20px; }
  .login-card input{
    width:100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    text-align:center;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }
  .login-card input:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .login-card button{
    width:100%;
    background: var(--ink);
    color:#fff;
    border:none;
    border-radius: 999px;
    padding: 11px;
    font-size: 14px;
    font-weight:600;
    letter-spacing:0.05em;
    cursor:pointer;
    font-family:inherit;
  }
  .login-card button:hover{ background: var(--teal-deep); }
  .login-error{ font-size: 12px; color: var(--red); margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <h1>服用紀錄卡</h1>
    <p>請輸入家庭通行碼以繼續</p>
    <input type="password" id="passcodeInput" placeholder="通行碼" onkeydown="if(event.key==='Enter') tryLogin()">
    <button onclick="tryLogin()">進入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appContent" style="display:none;">
<div class="wrap">

  <header class="top">
    <div class="brandmark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="3" y="12" width="24" height="10" rx="5" transform="rotate(-30 15 15)" stroke="#1F2A24" stroke-width="2" fill="#2F6F5E"/>
        <line x1="15" y1="6" x2="15" y2="24" stroke="#1F2A24" stroke-width="0" />
        <path d="M9 15 L21 15" stroke="#EEF3EE" stroke-width="2" transform="rotate(-30 15 15)"/>
      </svg>
      <div>
        <h1>服用紀錄卡</h1>
        <div class="sub">保健食品購買與成效追蹤</div>
      </div>
    </div>
    <div class="date-badge">
      <div id="todayBadge"></div>
      <div id="syncBadge" style="margin-top:4px; font-size:11px; color: var(--ink-soft);">雲端同步中…</div>
      <button onclick="doLogout()" style="margin-top:6px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:11px; cursor:pointer; font-family:inherit;">登出</button>
    </div>
  </header>

  <div class="tabs" style="margin-bottom:24px;">
    <button class="tab-btn active" data-tab="buy">購買紀錄</button>
    <button class="tab-btn" data-tab="use">服用紀錄</button>
    <button class="tab-btn" data-tab="stock">庫存／比價</button>
  </div>

  <!-- 購買紀錄 -->
  <section class="panel active" id="panel-buy">
    <div class="stats" id="buyStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增購買</h2>
      <div class="form-grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="buy-date">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>品項（用於比價分類，例如：綜合維他命C）</label>
          <input type="text" id="buy-item" placeholder="例如：綜合維他命C">
        </div>
        <div class="field">
          <label>品牌</label>
          <input type="text" id="buy-brand" placeholder="例如：善存">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>規格／劑量（選填）</label>
          <input type="text" id="buy-spec" placeholder="例如：500mg，60顆裝">
        </div>
        <div class="field">
          <label>每瓶／罐顆數</label>
          <input type="number" id="buy-units" min="1" step="1" placeholder="例如 100" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>購買數量（瓶／罐）</label>
          <input type="number" id="buy-qty" min="1" step="1" value="1" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>總價（元）</label>
          <input type="number" id="buy-total" min="0" step="1" placeholder="0" oninput="updateBuyCalc()">
        </div>
        <div class="field">
          <label>每瓶單價（自動）</label>
          <input type="text" id="buy-unitprice-display" disabled value="NT$ 0">
        </div>
        <div class="field">
          <label>每顆成本（自動）</label>
          <input type="text" id="buy-costperpiece-display" disabled value="—">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addPurchase()">新增這筆購買</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>採購紀錄</h2>
      <div id="buyListWrap"></div>
      <div class="pagination" id="buyPagination"></div>
    </div>
  </section>

  <!-- 服用紀錄 -->
  <section class="panel" id="panel-use">
    <div class="stats" id="useStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增服用紀錄</h2>
      <div class="form-grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="use-date">
        </div>
        <div class="field">
          <label>時間</label>
          <input type="time" id="use-time">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>品項</label>
          <select id="use-item">
            <option value="">請先於「購買紀錄」新增品項</option>
          </select>
        </div>
        <div class="field">
          <label>服用顆數</label>
          <input type="number" id="use-qty" min="0.5" step="0.5" value="1">
        </div>
        <div class="field">
          <label>劑量說明（選填）</label>
          <input type="text" id="use-dose" placeholder="例如：隨餐服用">
        </div>
        <div class="chip-select">
          <label>身體反應（可複選）</label>
          <div class="chip-row" id="reactionChips"></div>
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label>備註</label>
          <input type="text" id="use-note" placeholder="其他感受描述（選填）">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addUsage()">新增這筆紀錄</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>服用歷程</h2>
      <div id="useListWrap"></div>
      <div class="pagination" id="usePagination"></div>
    </div>
  </section>

  <!-- 商品庫存／比價 -->
  <section class="panel" id="panel-stock">
    <div class="card">
      <h2><span class="dot"></span>庫存與比價說明</h2>
      <p style="font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.6;">
        以「品項」分組：累計購買顆數扣除服用顆數為估算庫存（非精確值）；同一品項底下列出所有採購批次，依「每顆成本」由低到高排序，成本最低的批次會用底色標示，方便比較不同品牌／時間點的性價比。
      </p>
    </div>
    <div id="stockWrap"></div>
  </section>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ===== 請貼上 Firebase 專案設定（在 Firebase 主控台「專案設定」裡拿得到）=====
const firebaseConfig = {
  apiKey: "AIzaSyAZXE94WwGYSiR2UrOxzhABmNt14zFaMjE",
  authDomain: "someee-a18ab.firebaseapp.com",
  projectId: "someee-a18ab",
  storageBucket: "someee-a18ab.firebasestorage.app",
  messagingSenderId: "212789693257",
  appId: "1:212789693257:web:939aea98f5692496182898"
};

// 要跟你在 Firebase Authentication「使用者」分頁建立的那組帳號 email 完全一樣
const FAMILY_EMAIL = 'someetest@gmail.com';

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let purchases = [];
let usages = [];
let purchasePage = 1;
let usePage = 1;
const PAGE_SIZE = 20;

function setSyncStatus(text, isError){
  const el = document.getElementById('syncBadge');
  el.textContent = text;
  el.style.color = isError ? 'var(--red)' : 'var(--ink-soft)';
}

function doLogout(){
  auth.signOut();
}

function tryLogin(){
  const code = document.getElementById('passcodeInput').value;
  const errEl = document.getElementById('loginError');
  if(!code){
    errEl.textContent = '請輸入通行碼';
    return;
  }
  errEl.textContent = '登入中…';
  auth.signInWithEmailAndPassword(FAMILY_EMAIL, code)
    .catch(err => {
      console.error('登入失敗', err);
      errEl.textContent = '通行碼錯誤，請再試一次';
    });
}

function attachListeners(){
  setSyncStatus('雲端同步中…', false);

  db.collection('family').doc('shared').collection('purchases')
    .onSnapshot(snap => {
      purchases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPurchases();
      renderUseItemOptions();
      renderStock();
      setSyncStatus('已同步雲端', false);
    }, err => {
      console.error('讀取購買紀錄失敗', err);
      setSyncStatus('雲端讀取失敗，請確認 Firebase 設定與規則', true);
    });

  db.collection('family').doc('shared').collection('usages')
    .onSnapshot(snap => {
      usages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderUsages();
      renderStock();
      setSyncStatus('已同步雲端', false);
    }, err => {
      console.error('讀取服用紀錄失敗', err);
      setSyncStatus('雲端讀取失敗，請確認 Firebase 設定與規則', true);
    });
}

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    attachListeners();
  } else {
    document.getElementById('loginGate').style.display = 'flex';
    document.getElementById('appContent').style.display = 'none';
  }
});

const reactionOptions = [
  { key: '精神良好', type: 'good' },
  { key: '無感', type: 'neutral-grey' },
  { key: '胃不適', type: 'bad' },
  { key: '嗜睡', type: 'neutral' },
  { key: '皮膚起疹', type: 'bad' },
  { key: '睡眠改善', type: 'good' },
];
let selectedReactions = new Set();

function badgeClass(type){
  if(type === 'good') return 'b-good';
  if(type === 'bad') return 'b-bad';
  if(type === 'neutral') return 'b-neutral';
  return 'b-grey';
}

function fmtDate(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（週${w}）`;
}
document.getElementById('todayBadge').textContent = fmtDate();

// ---- tabs ----
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- reaction chips ----
function renderChips(){
  const row = document.getElementById('reactionChips');
  row.innerHTML = '';
  reactionOptions.forEach(opt=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = opt.key;
    if(selectedReactions.has(opt.key)){
      el.classList.add(opt.type === 'bad' ? 'on-bad' : opt.type === 'good' ? 'on-good' : 'on-neutral');
    }
    el.onclick = ()=>{
      if(selectedReactions.has(opt.key)) selectedReactions.delete(opt.key);
      else selectedReactions.add(opt.key);
      renderChips();
    };
    row.appendChild(el);
  });
}
renderChips();

// ---- purchase ----
function updateBuyCalc(){
  const units = parseFloat(document.getElementById('buy-units').value) || 0;
  const qty = parseFloat(document.getElementById('buy-qty').value) || 0;
  const total = parseFloat(document.getElementById('buy-total').value) || 0;
  const unitPrice = qty > 0 ? total / qty : 0;
  const totalPieces = units * qty;
  const costPerPiece = totalPieces > 0 ? total / totalPieces : 0;
  document.getElementById('buy-unitprice-display').value = 'NT$ ' + unitPrice.toFixed(1);
  document.getElementById('buy-costperpiece-display').value = totalPieces > 0 ? ('NT$ ' + costPerPiece.toFixed(2) + ' /顆') : '—';
}

async function addPurchase(){
  const date = document.getElementById('buy-date').value;
  const itemName = document.getElementById('buy-item').value.trim();
  const brand = document.getElementById('buy-brand').value.trim();
  const spec = document.getElementById('buy-spec').value.trim();
  const unitsPerContainer = parseFloat(document.getElementById('buy-units').value) || 0;
  const containerQty = parseInt(document.getElementById('buy-qty').value) || 1;
  const totalPrice = parseFloat(document.getElementById('buy-total').value) || 0;

  if(!date || !itemName || !brand || unitsPerContainer <= 0 || containerQty <= 0){
    alert('請至少填寫日期、品項、品牌、每瓶顆數與購買數量');
    return;
  }

  setSyncStatus('儲存中…', false);
  try {
    await db.collection('family').doc('shared').collection('purchases').add({
      date, itemName, brand, spec, unitsPerContainer, containerQty, totalPrice,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('buy-item').value = '';
    document.getElementById('buy-brand').value = '';
    document.getElementById('buy-spec').value = '';
    document.getElementById('buy-units').value = '';
    document.getElementById('buy-qty').value = 1;
    document.getElementById('buy-total').value = '';
    updateBuyCalc();
    setSyncStatus('已同步雲端', false);
  } catch(err){
    console.error('新增購買紀錄失敗', err);
    setSyncStatus('雲端寫入失敗，請確認網路與規則設定', true);
  }
}

async function deletePurchase(id){
  setSyncStatus('儲存中…', false);
  try {
    await db.collection('family').doc('shared').collection('purchases').doc(id).delete();
    setSyncStatus('已同步雲端', false);
  } catch(err){
    console.error('刪除購買紀錄失敗', err);
    setSyncStatus('雲端刪除失敗', true);
  }
}

function changePurchasePage(delta){
  purchasePage += delta;
  renderPurchases();
}

function renderPurchases(){
  const listWrap = document.getElementById('buyListWrap');
  const pageWrap = document.getElementById('buyPagination');

  const sorted = purchases.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if(purchasePage > totalPages) purchasePage = totalPages;
  if(purchasePage < 1) purchasePage = 1;
  const startIdx = (purchasePage - 1) * PAGE_SIZE;
  const pageItems = sorted.slice(startIdx, startIdx + PAGE_SIZE);

  if(sorted.length === 0){
    listWrap.innerHTML = '<div class="empty">還沒有購買紀錄，於上方表單新增第一筆吧。</div>';
    pageWrap.innerHTML = '';
  } else {
    listWrap.innerHTML = pageItems.map(p=>{
      const units = Number(p.unitsPerContainer) || 0;
      const qty = Number(p.containerQty) || 0;
      const total = Number(p.totalPrice) || 0;
      const pieces = units * qty;
      const costPerPiece = pieces > 0 ? total / pieces : 0;
      return `
        <div class="list-row">
          <div class="lr-main">
            <div class="lr-title">${p.itemName} <span class="lr-brand">・ ${p.brand}</span></div>
            <div class="lr-sub">${p.date}${p.spec ? ' ・ ' + p.spec : ''}</div>
            <div class="lr-sub">${qty} 瓶 × ${units} 顆／瓶</div>
          </div>
          <div class="lr-total">
            <div class="money">NT$ ${total.toLocaleString()}</div>
            <div class="lr-cost">${pieces>0 ? 'NT$ ' + costPerPiece.toFixed(2) + ' /顆' : ''}</div>
          </div>
          <button class="del-btn" onclick="deletePurchase('${p.id}')">刪除</button>
        </div>
      `;
    }).join('');

    pageWrap.innerHTML = `
      <button class="page-btn" onclick="changePurchasePage(-1)" ${purchasePage<=1?'disabled':''}>‹ 上一頁</button>
      <span class="page-info">第 ${purchasePage}／${totalPages} 頁（共 ${sorted.length} 筆）</span>
      <button class="page-btn" onclick="changePurchasePage(1)" ${purchasePage>=totalPages?'disabled':''}>下一頁 ›</button>
    `;
  }

  const totalSpend = purchases.reduce((s,p)=> s + (Number(p.totalPrice)||0), 0);
  const itemCount = new Set(purchases.map(p=>p.itemName)).size;
  document.getElementById('buyStats').innerHTML = `
    <div class="stat"><div class="num">NT$ ${totalSpend.toLocaleString()}</div><div class="label">累計花費</div></div>
    <div class="stat"><div class="num">${purchases.length}</div><div class="label">採購筆數</div></div>
    <div class="stat"><div class="num">${itemCount}</div><div class="label">品項種類</div></div>
  `;
}

function renderUseItemOptions(){
  const sel = document.getElementById('use-item');
  const prevValue = sel.value;
  if(purchases.length === 0){
    sel.innerHTML = '<option value="">請先於「購買紀錄」新增品項</option>';
    return;
  }
  const uniqueNames = [];
  const seen = new Set();
  purchases.slice().reverse().forEach(p=>{
    if(!seen.has(p.itemName)){ seen.add(p.itemName); uniqueNames.push(p.itemName); }
  });
  sel.innerHTML = uniqueNames.map(n=>`<option value="${n}">${n}</option>`).join('');
  if(uniqueNames.includes(prevValue)) sel.value = prevValue;
}

function changeUsePage(delta){
  usePage += delta;
  renderUsages();
}

function renderUsages(){
  const listWrap = document.getElementById('useListWrap');
  const pageWrap = document.getElementById('usePagination');

  const sorted = usages.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.time||'').localeCompare(a.time||''));
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if(usePage > totalPages) usePage = totalPages;
  if(usePage < 1) usePage = 1;
  const startIdx = (usePage - 1) * PAGE_SIZE;
  const pageItems = sorted.slice(startIdx, startIdx + PAGE_SIZE);

  if(sorted.length === 0){
    listWrap.innerHTML = '<div class="empty">還沒有服用紀錄，於上方表單新增第一筆吧。</div>';
    pageWrap.innerHTML = '';
  } else {
    listWrap.innerHTML = pageItems.map(u=>{
      const badges = (u.reactions||[]).map(r=>{
        const opt = reactionOptions.find(o=>o.key===r);
        const cls = opt ? badgeClass(opt.type.replace('neutral-grey','grey')) : 'b-grey';
        return `<span class="badge ${cls}">${r}</span>`;
      }).join('') || '<span style="color:var(--ink-soft); font-size:12px;">未記錄</span>';
      return `
        <div class="list-row">
          <div class="lr-main">
            <div class="lr-title">${u.itemName}${u.time ? ' ・ ' + u.time : ''}</div>
            <div class="lr-sub">${u.date} ・ ${u.qty || 1} 顆${u.dose ? ' ・ ' + u.dose : ''}</div>
            <div class="lr-sub">${badges}</div>
            ${u.note ? `<div class="lr-sub">${u.note}</div>` : ''}
          </div>
          <button class="del-btn" onclick="deleteUsage('${u.id}')">刪除</button>
        </div>
      `;
    }).join('');

    pageWrap.innerHTML = `
      <button class="page-btn" onclick="changeUsePage(-1)" ${usePage<=1?'disabled':''}>‹ 上一頁</button>
      <span class="page-info">第 ${usePage}／${totalPages} 頁（共 ${sorted.length} 筆）</span>
      <button class="page-btn" onclick="changeUsePage(1)" ${usePage>=totalPages?'disabled':''}>下一頁 ›</button>
    `;
  }

  const total = usages.length;
  const badCount = usages.filter(u=>(u.reactions||[]).some(r=>reactionOptions.find(o=>o.key===r)?.type==='bad')).length;
  const goodCount = usages.filter(u=>(u.reactions||[]).some(r=>reactionOptions.find(o=>o.key===r)?.type==='good')).length;
  const badRate = total ? Math.round(badCount/total*100) : 0;

  document.getElementById('useStats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">服用筆數</div></div>
    <div class="stat"><div class="num">${badRate}%</div><div class="label">不適發生率</div></div>
    <div class="stat"><div class="num">${goodCount}</div><div class="label">正向反應次數</div></div>
  `;
}

// ---- 庫存／比價 ----
function renderStock(){
  const wrap = document.getElementById('stockWrap');
  if(!wrap) return;

  const itemMap = {};
  purchases.forEach(p=>{
    const units = Number(p.unitsPerContainer) || 0;
    const qty = Number(p.containerQty) || 0;
    const total = Number(p.totalPrice) || 0;
    const pieces = units * qty;
    const costPerPiece = pieces > 0 ? total / pieces : 0;
    if(!itemMap[p.itemName]) itemMap[p.itemName] = { batches: [], totalPieces: 0 };
    itemMap[p.itemName].batches.push({ ...p, pieces, costPerPiece });
    itemMap[p.itemName].totalPieces += pieces;
  });

  const usedQtyMap = {};
  usages.forEach(u=>{
    usedQtyMap[u.itemName] = (usedQtyMap[u.itemName] || 0) + (Number(u.qty) || 1);
  });

  const names = Object.keys(itemMap);
  if(names.length === 0){
    wrap.innerHTML = '<div class="card"><div class="empty">還沒有購買紀錄，無法計算庫存與比價。</div></div>';
    return;
  }

  wrap.innerHTML = names.sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(name=>{
    const info = itemMap[name];
    const used = usedQtyMap[name] || 0;
    const remain = Math.round((info.totalPieces - used) * 10) / 10;
    const remainColor = remain <= 0 ? 'var(--red)' : (remain <= 10 ? 'var(--amber)' : 'var(--teal)');
    const sortedBatches = info.batches.slice().sort((a,b)=> a.costPerPiece - b.costPerPiece);
    const cheapest = sortedBatches.length ? sortedBatches[0].costPerPiece : null;

    const batchRows = sortedBatches.map(b=>`
      <tr class="${cheapest!==null && b.costPerPiece===cheapest ? 'best-row' : ''}">
        <td>${b.date}</td>
        <td>${b.brand}</td>
        <td>${b.spec || '—'}</td>
        <td>${b.containerQty} 瓶 × ${b.unitsPerContainer} 顆</td>
        <td class="money">NT$ ${Number(b.totalPrice).toLocaleString()}</td>
        <td class="money">${b.pieces>0 ? 'NT$ ' + b.costPerPiece.toFixed(2) + ' /顆' : '—'}${cheapest!==null && b.costPerPiece===cheapest ? ' 🏆' : ''}</td>
      </tr>
    `).join('');

    return `
      <div class="card item-card">
        <h2><span class="dot"></span>${name}</h2>
        <div class="stats">
          <div class="stat"><div class="num">${Math.round(info.totalPieces)}</div><div class="label">累計購買顆數</div></div>
          <div class="stat"><div class="num">${used}</div><div class="label">已服用顆數</div></div>
          <div class="stat"><div class="num" style="color:${remainColor}">${remain}</div><div class="label">估算剩餘顆數</div></div>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>日期</th><th>品牌</th><th>規格</th><th>數量</th><th>總價</th><th>每顆成本</th></tr></thead>
            <tbody>${batchRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');
}
