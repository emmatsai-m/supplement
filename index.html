<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>服用紀錄卡</title>
<style>
  :root{
    --bg: #EEF3EE;
    --panel: #FBFCF9;
    --ink: #1F2A24;
    --ink-soft: #5B6B61;
    --line: #D6DFD8;
    --teal: #2F6F5E;
    --teal-deep: #1E4A3E;
    --amber: #C97B2E;
    --red: #B24A42;
    --grey-chip: #8B958E;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brandmark svg{ flex-shrink:0; }
  h1{
    font-family: "Noto Serif TC", serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    margin:0;
    font-weight: 700;
  }
  .sub{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  .date-badge{
    font-family: "Noto Serif TC", serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align:right;
  }

  /* Tabs styled like a pill/capsule selector */
  .tabs{
    display:flex;
    gap:0;
    margin-bottom: 24px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
    width: fit-content;
  }
  .tab-btn{
    border:none;
    background: transparent;
    padding: 10px 26px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor:pointer;
    color: var(--ink);
    font-family: inherit;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background: var(--ink);
    color: #fff;
  }
  .tab-btn:not(.active):hover{
    background: rgba(31,42,36,0.08);
  }

  section.panel{
    display:none;
  }
  section.panel.active{
    display:block;
    animation: fade .25s ease;
  }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .card h2{
    font-size: 15px;
    margin: 0 0 16px;
    letter-spacing: 0.05em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--teal);
    display:inline-block;
  }

  .form-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field label{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .field input, .field select{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus, .field select:focus{
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }

  .chip-select{
    grid-column: 1 / -1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chip-select label{ font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    cursor:pointer;
    background:#fff;
    color: var(--ink-soft);
    user-select:none;
    transition: all .12s ease;
  }
  .chip.on-good{ background: var(--teal); border-color: var(--teal); color:#fff; }
  .chip.on-bad{ background: var(--red); border-color: var(--red); color:#fff; }
  .chip.on-neutral{ background: var(--amber); border-color: var(--amber); color:#fff; }

  .actions{
    margin-top: 18px;
    display:flex;
    justify-content:flex-end;
  }
  button.submit{
    background: var(--ink);
    color:#fff;
    border:none;
    border-radius: 999px;
    padding: 10px 26px;
    font-size: 13.5px;
    font-weight:600;
    letter-spacing:0.05em;
    cursor:pointer;
    font-family:inherit;
  }
  button.submit:hover{ background: var(--teal-deep); }

  /* summary strip */
  .stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat{
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    padding: 14px 16px;
  }
  .stat .num{
    font-family:"Noto Serif TC", serif;
    font-size: 22px;
    color: var(--teal-deep);
  }
  .stat .label{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  table{
    width:100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th{
    text-align:left;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    padding: 8px 10px;
    border-bottom: 1.5px solid var(--ink);
  }
  tbody td{
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  tbody tr:hover{ background: rgba(47,111,94,0.05); }
  .badge{
    display:inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    color:#fff;
    margin: 1px 3px 1px 0;
  }
  .b-good{ background: var(--teal); }
  .b-bad{ background: var(--red); }
  .b-neutral{ background: var(--amber); }
  .b-grey{ background: var(--grey-chip); }

  .empty{
    text-align:center;
    padding: 30px 10px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .money{ font-family:"Noto Serif TC", serif; }
  .del-btn{
    border:none; background:none; cursor:pointer;
    color: var(--ink-soft); font-size: 12px;
  }
  .del-btn:hover{ color: var(--red); }

  .table-scroll{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{ min-width: 560px; }

  @media (max-width: 700px){
    .wrap{ padding: 20px 14px 60px; }
    header.top{
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .date-badge{ text-align:left; }
    h1{ font-size:22px; }
    .tabs{ width:100%; }
    .tab-btn{ flex:1; text-align:center; padding:10px 8px; }
    .card{ padding: 16px 16px; }
    .actions{ justify-content:stretch; }
    button.submit{ width:100%; }
  }

  @media (max-width: 420px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
    .form-grid{ grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brandmark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="3" y="12" width="24" height="10" rx="5" transform="rotate(-30 15 15)" stroke="#1F2A24" stroke-width="2" fill="#2F6F5E"/>
        <line x1="15" y1="6" x2="15" y2="24" stroke="#1F2A24" stroke-width="0" />
        <path d="M9 15 L21 15" stroke="#EEF3EE" stroke-width="2" transform="rotate(-30 15 15)"/>
      </svg>
      <div>
        <h1>服用紀錄卡</h1>
        <div class="sub">保健食品購買與成效追蹤</div>
      </div>
    </div>
    <div class="date-badge">
      <div id="todayBadge"></div>
      <div id="syncBadge" style="margin-top:4px; font-size:11px; color: var(--ink-soft);">雲端同步中…</div>
    </div>
  </header>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px;">
    <div class="tabs" style="margin-bottom:0;">
      <button class="tab-btn active" data-tab="buy">購買紀錄</button>
      <button class="tab-btn" data-tab="use">服用紀錄</button>
    </div>
    <button onclick="resetAllData()" style="border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px; padding:7px 16px; font-size:12px; cursor:pointer; font-family:inherit;">清除我的所有紀錄</button>
  </div>

  <!-- 購買紀錄 -->
  <section class="panel active" id="panel-buy">
    <div class="stats" id="buyStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增購買</h2>
      <div class="form-grid">
        <div class="field">
          <label>購買日期</label>
          <input type="date" id="buy-date">
        </div>
        <div class="field">
          <label>品牌</label>
          <input type="text" id="buy-brand" placeholder="例如：善存">
        </div>
        <div class="field">
          <label>品名</label>
          <input type="text" id="buy-name" placeholder="例如：綜合維他命">
        </div>
        <div class="field">
          <label>單價（元）</label>
          <input type="number" id="buy-price" min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label>數量（瓶／盒）</label>
          <input type="number" id="buy-qty" min="1" step="1" value="1">
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label>備註</label>
          <input type="text" id="buy-note" placeholder="購買通路、優惠等（選填）">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addPurchase()">新增這筆購買</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>購買清單</h2>
      <div id="buyTableWrap"></div>
    </div>
  </section>

  <!-- 服用紀錄 -->
  <section class="panel" id="panel-use">
    <div class="stats" id="useStats"></div>

    <div class="card">
      <h2><span class="dot"></span>新增服用紀錄</h2>
      <div class="form-grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="use-date">
        </div>
        <div class="field">
          <label>時間</label>
          <input type="time" id="use-time">
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>品牌／品名</label>
          <select id="use-item">
            <option value="">請先於「購買紀錄」新增品項</option>
          </select>
        </div>
        <div class="field">
          <label>劑量</label>
          <input type="text" id="use-dose" placeholder="例如：2錠">
        </div>
        <div class="chip-select">
          <label>身體反應（可複選）</label>
          <div class="chip-row" id="reactionChips"></div>
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label>備註</label>
          <input type="text" id="use-note" placeholder="其他感受描述（選填）">
        </div>
      </div>
      <div class="actions">
        <button class="submit" onclick="addUsage()">新增這筆紀錄</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>服用歷程</h2>
      <div id="useTableWrap"></div>
    </div>
  </section>

</div>

<script>
// ===== 請先修改這兩行 =====
// 貼上你在 Apps Script「部署 → 新增部署作業」拿到的網址
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyYjq8jYKRSd-a2jF6BCow-BA-qrJOPFLP4Ciqz4C9gYb2q4U3NhXeMA_X0UxVVejzs/exec';
// 要跟 Code.gs 裡的 SECRET 完全一樣
const SECRET = 'FIRST_AIWEB_BY_EMMA';

let purchases = [];
let usages = [];
let purchaseSeq = 1;
let usageSeq = 1;

function setSyncStatus(text, isError){
  const el = document.getElementById('syncBadge');
  el.textContent = text;
  el.style.color = isError ? 'var(--red)' : 'var(--ink-soft)';
}

function nextSeq(list){
  return list.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
}

async function loadAllData(){
  setSyncStatus('雲端同步中…', false);
  try {
    const res = await fetch(`${WEB_APP_URL}?secret=${encodeURIComponent(SECRET)}`);
    const json = await res.json();
    if(json.error) throw new Error(json.error);

    purchases = (json.purchases || []).map(p => ({
      ...p, price: Number(p.price) || 0, qty: Number(p.qty) || 0, id: Number(p.id)
    }));
    usages = (json.usages || []).map(u => ({ ...u, id: Number(u.id) }));
    purchaseSeq = nextSeq(purchases);
    usageSeq = nextSeq(usages);

    setSyncStatus('已同步雲端', false);
  } catch(err){
    console.error('載入 Google Sheets 資料失敗', err);
    setSyncStatus('雲端載入失敗，請確認網址與密鑰設定', true);
  }
  renderPurchases();
  renderUseItemOptions();
  renderUsages();
}

async function postToSheet(action, data){
  setSyncStatus('儲存中…', false);
  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, secret: SECRET, data })
    });
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    setSyncStatus('已同步雲端', false);
  } catch(err){
    console.error('寫入 Google Sheets 失敗', err);
    setSyncStatus('雲端儲存失敗，這筆僅暫存在本機', true);
  }
}

function savePurchases(){ return postToSheet('savePurchases', purchases); }
function saveUsages(){ return postToSheet('saveUsages', usages); }

async function resetAllData(){
  if(!confirm('確定要清除 Google 試算表上所有購買與服用紀錄嗎？此動作無法復原。')) return;
  purchases = [];
  usages = [];
  purchaseSeq = 1;
  usageSeq = 1;
  renderPurchases();
  renderUseItemOptions();
  renderUsages();
  await savePurchases();
  await saveUsages();
  setSyncStatus('已清除', false);
}

const reactionOptions = [
  { key: '精神良好', type: 'good' },
  { key: '無感', type: 'neutral-grey' },
  { key: '胃不適', type: 'bad' },
  { key: '嗜睡', type: 'neutral' },
  { key: '皮膚起疹', type: 'bad' },
  { key: '睡眠改善', type: 'good' },
];
let selectedReactions = new Set();

function badgeClass(type){
  if(type === 'good') return 'b-good';
  if(type === 'bad') return 'b-bad';
  if(type === 'neutral') return 'b-neutral';
  return 'b-grey';
}

function fmtDate(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（週${w}）`;
}
document.getElementById('todayBadge').textContent = fmtDate();

// ---- tabs ----
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- reaction chips render ----
function renderChips(){
  const row = document.getElementById('reactionChips');
  row.innerHTML = '';
  reactionOptions.forEach(opt=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = opt.key;
    if(selectedReactions.has(opt.key)){
      el.classList.add(opt.type === 'bad' ? 'on-bad' : opt.type === 'good' ? 'on-good' : 'on-neutral');
    }
    el.onclick = ()=>{
      if(selectedReactions.has(opt.key)) selectedReactions.delete(opt.key);
      else selectedReactions.add(opt.key);
      renderChips();
    };
    row.appendChild(el);
  });
}
renderChips();

// ---- purchase ----
function addPurchase(){
  const date = document.getElementById('buy-date').value;
  const brand = document.getElementById('buy-brand').value.trim();
  const name = document.getElementById('buy-name').value.trim();
  const price = parseFloat(document.getElementById('buy-price').value) || 0;
  const qty = parseInt(document.getElementById('buy-qty').value) || 1;
  const note = document.getElementById('buy-note').value.trim();

  if(!date || !brand || !name){
    alert('請至少填寫日期、品牌與品名');
    return;
  }

  purchases.push({ id: purchaseSeq++, date, brand, name, price, qty, note });

  document.getElementById('buy-brand').value = '';
  document.getElementById('buy-name').value = '';
  document.getElementById('buy-price').value = '';
  document.getElementById('buy-qty').value = 1;
  document.getElementById('buy-note').value = '';

  renderPurchases();
  renderUseItemOptions();
  savePurchases();
}

function deletePurchase(id){
  purchases = purchases.filter(p=>p.id !== id);
  renderPurchases();
  renderUseItemOptions();
  savePurchases();
}

function renderPurchases(){
  const wrap = document.getElementById('buyTableWrap');
  if(purchases.length === 0){
    wrap.innerHTML = '<div class="empty">還沒有購買紀錄，於上方表單新增第一筆吧。</div>';
  } else {
    const rows = purchases.slice().reverse().map(p=>`
      <tr>
        <td>${p.date}</td>
        <td>${p.brand}</td>
        <td>${p.name}</td>
        <td class="money">NT$ ${p.price.toLocaleString()}</td>
        <td>${p.qty}</td>
        <td class="money">NT$ ${(p.price*p.qty).toLocaleString()}</td>
        <td>${p.note || '—'}</td>
        <td><button class="del-btn" onclick="deletePurchase(${p.id})">刪除</button></td>
      </tr>
    `).join('');
    wrap.innerHTML = `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>日期</th><th>品牌</th><th>品名</th><th>單價</th><th>數量</th><th>小計</th><th>備註</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    `;
  }

  const totalSpend = purchases.reduce((s,p)=> s + p.price*p.qty, 0);
  const brandCount = new Set(purchases.map(p=>p.brand)).size;
  document.getElementById('buyStats').innerHTML = `
    <div class="stat"><div class="num">NT$ ${totalSpend.toLocaleString()}</div><div class="label">累計花費</div></div>
    <div class="stat"><div class="num">${purchases.length}</div><div class="label">購買筆數</div></div>
    <div class="stat"><div class="num">${brandCount}</div><div class="label">品牌數</div></div>
  `;
}

function renderUseItemOptions(){
  const sel = document.getElementById('use-item');
  if(purchases.length === 0){
    sel.innerHTML = '<option value="">請先於「購買紀錄」新增品項</option>';
    return;
  }
  const uniqueItems = [];
  const seen = new Set();
  purchases.slice().reverse().forEach(p=>{
    const key = p.brand + ' ' + p.name;
    if(!seen.has(key)){ seen.add(key); uniqueItems.push(key); }
  });
  sel.innerHTML = uniqueItems.map(k=>`<option value="${k}">${k}</option>`).join('');
}

// ---- usage ----
function addUsage(){
  const date = document.getElementById('use-date').value;
  const time = document.getElementById('use-time').value;
  const item = document.getElementById('use-item').value;
  const dose = document.getElementById('use-dose').value.trim();
  const note = document.getElementById('use-note').value.trim();

  if(!date || !item){
    alert('請至少填寫日期與品牌／品名');
    return;
  }

  usages.push({
    id: usageSeq++,
    date, time, item, dose, note,
    reactions: Array.from(selectedReactions)
  });

  selectedReactions.clear();
  renderChips();
  document.getElementById('use-dose').value = '';
  document.getElementById('use-note').value = '';

  renderUsages();
  saveUsages();
}

function deleteUsage(id){
  usages = usages.filter(u=>u.id !== id);
  renderUsages();
  saveUsages();
}

function renderUsages(){
  const wrap = document.getElementById('useTableWrap');
  if(usages.length === 0){
    wrap.innerHTML = '<div class="empty">還沒有服用紀錄，於上方表單新增第一筆吧。</div>';
  } else {
    const rows = usages.slice().reverse().map(u=>{
      const badges = u.reactions.map(r=>{
        const opt = reactionOptions.find(o=>o.key===r);
        const cls = opt ? badgeClass(opt.type.replace('neutral-grey','grey')) : 'b-grey';
        return `<span class="badge ${cls}">${r}</span>`;
      }).join('') || '<span style="color:var(--ink-soft); font-size:12px;">未記錄</span>';
      return `
        <tr>
          <td>${u.date}${u.time ? ' ' + u.time : ''}</td>
          <td>${u.item}</td>
          <td>${u.dose || '—'}</td>
          <td>${badges}</td>
          <td>${u.note || '—'}</td>
          <td><button class="del-btn" onclick="deleteUsage(${u.id})">刪除</button></td>
        </tr>
      `;
    }).join('');
    wrap.innerHTML = `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>日期時間</th><th>品項</th><th>劑量</th><th>身體反應</th><th>備註</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    `;
  }

  const total = usages.length;
  const badCount = usages.filter(u=>u.reactions.some(r=>reactionOptions.find(o=>o.key===r)?.type==='bad')).length;
  const goodCount = usages.filter(u=>u.reactions.some(r=>reactionOptions.find(o=>o.key===r)?.type==='good')).length;
  const badRate = total ? Math.round(badCount/total*100) : 0;

  document.getElementById('useStats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">服用筆數</div></div>
    <div class="stat"><div class="num">${badRate}%</div><div class="label">不適發生率</div></div>
    <div class="stat"><div class="num">${goodCount}</div><div class="label">正向反應次數</div></div>
  `;
}

// ---- init ----
(function initDates(){
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('buy-date').value = today;
  document.getElementById('use-date').value = today;
  const now = new Date();
  document.getElementById('use-time').value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
})();

loadAllData();
</script>
